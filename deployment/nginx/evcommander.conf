server {
    listen 80;
    listen [::]:80;
    server_name evcommander.evoldream.tech;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://evcommander.evoldream.tech$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evcommander.evoldream.tech;
    ssl_certificate /etc/letsencrypt/live/evcommander.evoldream.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evcommander.evoldream.tech/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 160k;
    location = /api/common/upload {
        client_max_body_size 33m;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host evcommander.evoldream.tech;
    }
    location = /scrm-api/api/scrm/contacts/import/preview {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host evcommander.evoldream.tech;
    }
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host evcommander.evoldream.tech;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
